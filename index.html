<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a00">
<meta name="description" content="Lakshya — Study, Routine, Fitness, Music and AI in one focused experience.">
<title>Lakshya</title>
<style>
:root{
  --gold:#ffc107;--orange:#ff8a00;--red:#ef3d24;--ink:#171717;--muted:#707070;
  --bg:#f7f7f6;--card:#fff;--line:#e9e9e7;--soft:#fff4df;--green:#20a464;
  --shadow:0 12px 36px rgba(0,0,0,.07);--radius:22px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
#app{min-height:100vh}
.shell{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:100px}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;position:sticky;top:0;z-index:50;background:rgba(247,247,246,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:11px}.brand img{width:44px;height:44px;object-fit:contain;border-radius:13px}.brand strong{letter-spacing:.13em;font-size:17px}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.top-actions{display:flex;gap:9px;align-items:center}
.icon-btn,.ghost-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--orange),var(--red));color:#fff;font-weight:800;border:0}
.content{padding:22px}
.hero{border-radius:30px;padding:30px;background:linear-gradient(135deg,#fff8e5 0%,#fff 55%,#fff1eb 100%);border:1px solid #f0e2cc;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-100px;background:linear-gradient(135deg,rgba(255,193,7,.22),rgba(239,61,36,.08));filter:blur(2px)}
.hero small{font-weight:800;color:#a25d00;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.02;margin:10px 0 8px;letter-spacing:-.055em;max-width:700px}
.hero p{color:var(--muted);max-width:640px;line-height:1.55;margin:0}
.hero-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.primary{border:0;color:#fff;padding:12px 17px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--orange),var(--red));font-weight:800;box-shadow:0 9px 20px rgba(255,119,0,.2)}
.secondary{border:1px solid var(--line);background:#fff;padding:12px 17px;border-radius:14px;font-weight:750}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 2px 13px}
.section-head h2{margin:0;font-size:19px;letter-spacing:-.025em}.section-head span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 7px 24px rgba(0,0,0,.035)}
.feature{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}.feature:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.feature .ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:var(--soft);font-size:21px}
.feature h3{margin:13px 0 4px;font-size:16px}.feature p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}
.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.row-main{flex:1;min-width:0}.row-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.row-action{border:0;background:#f4f4f2;border-radius:11px;padding:9px 11px}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f4f4f2;color:#666;font-size:10px;font-weight:800}
.video-card{overflow:hidden;padding:0}.thumb{height:170px;background:#181818;display:grid;place-items:center;color:#fff;font-size:38px}.video-info{padding:15px}.video-info h3{margin:0 0 5px;font-size:16px}.video-info p{margin:0;color:var(--muted);font-size:12px}.video-info button{margin-top:13px}
.player-card{padding:18px;background:#111;color:#fff;border:0}.player-screen{background:#050505;border-radius:18px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.player-screen video{width:100%;height:100%;object-fit:contain}.player-title{font-weight:800;margin:13px 0 3px}.player-meta{color:#aaa;font-size:11px}
.controls-line{display:flex;align-items:center;gap:10px;margin-top:13px}.controls-line input{flex:1}
input[type=range]{accent-color:var(--orange)}
.music-cover{width:100%;max-width:340px;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:24px;display:block;margin:0 auto 16px}
.music-layout{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}.music-now{padding:20px}.music-now h2{margin:0;font-size:22px}.music-now p{color:#aaa;margin:5px 0 0;font-size:12px}.dark{background:#111;color:#fff;border-color:#111}
.music-controls{display:flex;justify-content:center;align-items:center;gap:13px;margin:14px 0}.round{width:46px;height:46px;border-radius:50%;border:0;background:#252525;color:#fff}.round.big{width:58px;height:58px;background:linear-gradient(135deg,var(--gold),var(--orange),var(--red));font-size:20px}
.music-tools{display:flex;align-items:center;gap:10px}.music-tools button{border:1px solid #333;background:#1c1c1c;color:#ddd;padding:9px 11px;border-radius:11px}.music-tools input{flex:1}
.track.active{border-color:#ffb75c;box-shadow:0 7px 22px rgba(255,130,0,.08)}.track-num{width:31px;height:31px;border-radius:10px;background:#fff2d8;display:grid;place-items:center;font-size:11px;font-weight:900}
.streak{display:flex;align-items:center;gap:16px}.streak-ring{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) 0 72%,#eee 72% 100%);position:relative}.streak-ring:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.streak-ring b{position:relative;z-index:1;font-size:21px}.streak h3{margin:0 0 4px}.streak p{margin:0;color:var(--muted);font-size:12px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:500px}.chat-log{flex:1;overflow:auto;padding:8px 3px}.bubble{max-width:82%;padding:12px 14px;border-radius:18px;margin:7px 0;line-height:1.45;font-size:13px;white-space:pre-wrap}.bubble.user{margin-left:auto;background:linear-gradient(135deg,#fff0cf,#ffe8d5)}.bubble.ai{background:#fff;border:1px solid var(--line)}.chat-bar{display:flex;gap:8px;margin-top:10px}.chat-bar textarea{flex:1;border:1px solid var(--line);border-radius:16px;padding:12px;resize:none;min-height:48px;max-height:120px;background:#fff}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#fff4d5,#f7f7f6 45%,#f2f2f0)}
.auth-box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:25px;box-shadow:var(--shadow)}
.auth-logo{width:72px;height:72px;display:block;margin:0 auto 10px;object-fit:contain}.auth h1{text-align:center;margin:0;font-size:25px;letter-spacing:-.04em}.auth .sub{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4f4f2;border-radius:13px;padding:3px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;color:#777}.tabs button.active{background:#fff;color:#171717;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 6px;color:#555}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff}.field input:focus,.field textarea:focus{border-color:#ffae4c;box-shadow:0 0 0 3px rgba(255,145,0,.1)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:#666;margin:12px 0}.check input{margin-top:2px}.error{background:#fff0ef;border:1px solid #ffd2ce;color:#b92b1b;border-radius:12px;padding:10px;font-size:11px;margin:10px 0}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(680px,calc(100% - 24px));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:60}
.nav-btn{border:0;background:transparent;border-radius:16px;padding:8px 4px;color:#888;font-size:10px;font-weight:750}.nav-btn b{display:block;font-size:17px;margin-bottom:2px}.nav-btn.active{background:#fff2d9;color:#e66d00}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:18px}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{margin:0}.close{border:0;background:#f1f1ef;border-radius:11px;width:38px;height:38px}
.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:15px}.admin-side{background:#111;color:#fff;border-radius:22px;padding:13px;height:max-content;position:sticky;top:90px}.admin-side button{width:100%;text-align:left;border:0;background:transparent;color:#bbb;padding:11px;border-radius:12px;margin:2px 0}.admin-side button.active{background:#262626;color:#fff}.admin-main{min-width:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;z-index:200;box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:#888;border:1px dashed #d9d9d5;border-radius:18px;background:#fff;font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.music-layout{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.admin-side{position:static;display:flex;overflow:auto;gap:5px}.admin-side button{white-space:nowrap;width:auto}.content{padding:16px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.topbar{padding:11px 14px}.content{padding:12px}.hero{padding:23px;border-radius:25px}.stats{grid-template-columns:1fr 1fr}.bottom-nav{width:calc(100% - 14px);bottom:7px}.nav-btn{font-size:9px}.nav-btn b{font-size:16px}.music-layout{gap:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
/* =========================
   LAKSHYA FRONTEND
   Backend: Google Apps Script
   ========================= */
const API_URL='https://script.google.com/macros/s/AKfycbw6XO4jvKo7Vzjylq1hU0-oVCuFx9fofAT7GQ6Pud0Fot3Kx8GnYAs59HqoXZXXN9Eh/exec';
const ASSETS={
  logo:'lakshya_logo.png',
  tracks:[
    {title:'Lakshya Track 01',file:'track_01.mp3',category:'Lakshya Music'},
    {title:'Lakshya Track 02',file:'track_02.mp3',category:'Lakshya Music'},
    {title:'Lakshya Track 03',file:'track_03.mp3',category:'Lakshya Music'}
  ]
};
const state={
  token:localStorage.getItem('lakshya_token')||'',
  user:null,page:'home',tab:'login',
  home:null,study:[],routines:[],music:[],streak:null,
  adminToken:'',adminPage:'overview',video:null,
  musicIndex:0,shuffle:false,aiBusy:false
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2400)}
function fmt(sec){sec=Number(sec);if(!isFinite(sec)||sec<0)return'0:00';sec=Math.floor(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
async function api(action,args={},silent=false){
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'Request failed');
    return j.data;
  }catch(e){if(!silent)toast(e.message);throw e}
}
function initials(name){return String(name||'L').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function nav(page){state.page=page;render();loadPageData(page)}
function logout(){localStorage.removeItem('lakshya_token');state.token='';state.user=null;renderAuth()}
function renderAuth(){
  $('#app').innerHTML=`<div class="auth"><div class="auth-box">
    <img class="auth-logo" src="${ASSETS.logo}" alt="Lakshya">
    <h1>LAKSHYA</h1><div class="sub">Focus. Learn. Move forward.</div>
    <div class="tabs"><button class="${state.tab==='login'?'active':''}" onclick="state.tab='login';renderAuth()">Login</button><button class="${state.tab==='signup'?'active':''}" onclick="state.tab='signup';renderAuth()">Create account</button></div>
    <div id="authForm"></div>
  </div></div>`;
  const signup=state.tab==='signup';
  $('#authForm').innerHTML=signup?`
    <div class="field"><label>FULL NAME</label><input id="aname" placeholder="Your name"></div>
    <div class="field"><label>MOBILE NUMBER</label><input id="amobile" inputmode="numeric" maxlength="13" placeholder="10-digit mobile number"></div>
    <div class="field"><label>GOOGLE ACCOUNT EMAIL</label><input id="aemail" type="email" placeholder="yourname@gmail.com"></div>
    <div class="field"><label>LAKSHYA PASSWORD</label><input id="apass" type="password" placeholder="Create your password"></div>
    <label class="check"><input id="aconsent" type="checkbox"> <span>I agree to Lakshya's account, content and app-permission disclosures. Permissions are requested by the Android app only when required.</span></label>
    <button class="primary" style="width:100%" onclick="signup()">Create Lakshya account</button>
    <button class="secondary" style="width:100%;margin-top:9px" onclick="googleAccountHook()">Continue with Google account</button>
  `:`
    <div class="field"><label>MOBILE NUMBER</label><input id="lmobile" inputmode="numeric" maxlength="13" placeholder="10-digit mobile number"></div>
    <div class="field"><label>LAKSHYA PASSWORD</label><input id="lpass" type="password" placeholder="Your password"></div>
    <button class="primary" style="width:100%" onclick="login()">Login to Lakshya</button>
    <button class="secondary" style="width:100%;margin-top:9px" onclick="adminLoginUI()">Admin login</button>
    <p style="font-size:11px;color:#888;line-height:1.5;text-align:center;margin:15px 0 0">Your session can remain active for the configured period. Use Logout when you want to end it.</p>
  `;
}
function googleAccountHook(){
  toast('Google Account chooser is connected by the Android app layer; this web form keeps the selected email for signup.');
  const email=prompt('Selected Google account email');
  if(email) $('#aemail').value=email;
}
async function signup(){
  const data={name:$('#aname').value,mobile:$('#amobile').value,email:$('#aemail').value,password:$('#apass').value,deviceId:navigator.userAgent.slice(0,140)};
  if(!$('#aconsent').checked)return toast('Please accept the signup disclosure.');
  try{const d=await api('signup',data);state.token=d.token;localStorage.setItem('lakshya_token',d.token);await startApp();toast('Welcome to Lakshya');}catch(e){}
}
async function login(){
  try{const d=await api('login',{mobile:$('#lmobile').value,password:$('#lpass').value,deviceId:navigator.userAgent.slice(0,140)});state.token=d.token;localStorage.setItem('lakshya_token',d.token);await startApp();}catch(e){}
}
async function startApp(){
  try{state.user=await api('me',{token:state.token});renderApp();await loadPageData('home')}catch(e){logout()}
}
function renderApp(){
  const navs=[['home','⌂','Home'],['study','▣','Study'],['fitness','◉','Fitness'],['music','♫','Music'],['ai','✦','AI']];
  $('#app').innerHTML=`<div class="shell">
    <header class="topbar"><div class="brand"><img src="${ASSETS.logo}" alt=""><div><strong>LAKSHYA</strong><span>${esc(state.user?.name||'Welcome')}</span></div></div>
    <div class="top-actions"><button class="icon-btn" onclick="openProfile()">⚙</button><button class="avatar" onclick="openProfile()">${esc(initials(state.user?.name))}</button></div></header>
    <main class="content" id="page"></main>
    <nav class="bottom-nav">${navs.map(n=>`<button class="nav-btn ${state.page===n[0]?'active':''}" onclick="nav('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav>
  </div>`;
  renderPage();
}
async function loadPageData(page){
  if(!state.token)return;
  try{
    if(page==='home')state.home=await api('getHome',{token:state.token},true);
    if(page==='study')state.study=await api('getStudyContent',{token:state.token},true);
    if(page==='fitness'){state.routines=await api('getRoutines',{token:state.token},true);state.streak=await api('getStreak',{token:state.token},true)}
    if(page==='music')state.music=await api('getMusic',{token:state.token},true);
    if(page==='ai'){}
    renderPage();
  }catch(e){}
}
function renderPage(){
  if(!state.user)return;
  const p=$('#page'); if(!p)return;
  if(state.page==='home')p.innerHTML=homeHTML();
  if(state.page==='study')p.innerHTML=studyHTML();
  if(state.page==='fitness')p.innerHTML=fitnessHTML();
  if(state.page==='music')p.innerHTML=musicHTML();
  if(state.page==='ai')p.innerHTML=aiHTML();
}
function homeHTML(){
  const h=state.home||{}, streak=h.streak||{};
  return `<section class="hero"><small>Welcome back</small><h1>Build your focus. One day at a time.</h1><p>Study, fitness, music and AI — organized in one clean Lakshya experience.</p>
  <div class="hero-row"><button class="primary" onclick="nav('study')">Open Study</button><button class="secondary" onclick="nav('fitness')">Start routine</button></div></section>
  <div class="section-head"><h2>Your progress</h2><span>Personal dashboard</span></div>
  <div class="stats"><div class="stat"><b>${esc(streak.current_streak||0)}</b><span>Current streak</span></div><div class="stat"><b>${esc(streak.longest_streak||0)}</b><span>Longest streak</span></div><div class="stat"><b>${(h.study||[]).length}</b><span>Study items</span></div></div>
  <div class="section-head"><h2>Explore Lakshya</h2><span>Everything in one place</span></div>
  <div class="grid">
   <div class="card feature" onclick="nav('study')"><div class="ico">📚</div><div><h3>Study</h3><p>Only the study content assigned to your batch.</p></div></div>
   <div class="card feature" onclick="nav('fitness')"><div class="ico">🔥</div><div><h3>Routine & Fitness</h3><p>Exercises, timers, completion and streak tracking.</p></div></div>
   <div class="card feature" onclick="nav('music')"><div class="ico">🎵</div><div><h3>Music</h3><p>Playlist, random play, controls and history.</p></div></div>
   <div class="card feature" onclick="nav('ai')"><div class="ico">✦</div><div><h3>Lakshya AI</h3><p>Study help, revision and productivity assistance.</p></div></div>
   <div class="card feature" onclick="openProfile()"><div class="ico">👤</div><div><h3>Profile & Settings</h3><p>Manage your account, preferences and consent records.</p></div></div>
  </div>`;
}
function studyHTML(){
  const items=state.study||[];
  return `<div class="section-head"><h2>Study</h2><span>${items.length} available</span></div>
  <div class="list">${items.length?items.map((x,i)=>`<div class="card video-card"><div class="thumb">▶</div><div class="video-info"><span class="badge">${esc(x.type||'CONTENT')}</span><h3>${esc(x.title)}</h3><p>Assigned batch content</p><button class="primary" onclick='openVideo(${JSON.stringify(x)})'>Open content</button></div></div>`).join(''):`<div class="empty">No study content has been assigned to your batch yet.</div>`}</div>`;
}
function fitnessHTML(){
  const s=state.streak||{}, rs=state.routines||[];
  return `<div class="card streak"><div class="streak-ring"><b>${esc(s.current_streak||0)}</b></div><div><h3>Day streak</h3><p>Longest: ${esc(s.longest_streak||0)} days</p><p style="margin-top:5px">Complete a meaningful routine to continue the streak.</p></div></div>
  <div class="section-head"><h2>Today's routines</h2><span>${rs.length} routines</span></div>
  <div class="list">${rs.length?rs.map(r=>`<div class="row"><div class="track-num">◉</div><div class="row-main"><b>${esc(r.title)}</b><span>${esc(r.category||'Fitness')} • ${fmt(r.duration_sec)} • ${esc(r.instructions||'')}</span></div><button class="row-action" onclick='startRoutine(${JSON.stringify(r)})'>Start</button></div>`).join(''):`<div class="empty">No active routines yet.</div>`}</div>`;
}
function startRoutine(r){
  const steps=api('getRoutineSteps',{token:state.token,routineId:r.routine_id},true);
  steps.then(s=>openRoutineModal(r,s)).catch(()=>openRoutineModal(r,[]));
}
function openRoutineModal(r,steps){
  $('#modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h3>${esc(r.title)}</h3><button class="close" onclick="closeModal()">×</button></div><p style="color:#777;font-size:12px">${esc(r.instructions||'Complete the routine at your own pace.')}</p><div id="routineTimer" style="font-size:58px;font-weight:900;text-align:center;margin:28px 0">00:00</div><div style="display:flex;gap:8px;justify-content:center"><button class="primary" id="routineStart">Start timer</button><button class="secondary" id="routineDone">Complete</button></div><div class="section-head"><h2>Steps</h2><span>${steps.length}</span></div><div class="list">${steps.map((s,i)=>`<div class="row"><div class="track-num">${i+1}</div><div class="row-main"><b>${esc(s.title)}</b><span>${fmt(s.duration_sec)} • ${esc(s.instructions||'')}</span></div></div>`).join('')||'<div class="empty">No individual steps configured.</div>'}</div></div>`;
  $('#modal').classList.remove('hidden');
  let sec=0,timer=null;
  $('#routineStart').onclick=()=>{if(timer)return;timer=setInterval(()=>{sec++;$('#routineTimer').textContent=fmt(sec)},1000)}
  $('#routineDone').onclick=async()=>{clearInterval(timer);await api('completeRoutine',{token:state.token,routineId:r.routine_id,durationSec:sec});closeModal();await loadPageData('fitness');toast('Routine completed — streak updated.')}
}
function musicHTML(){
  const local=ASSETS.tracks;
  const current=local[state.musicIndex]||local[0];
  return `<div class="music-layout"><section class="card dark music-now"><img class="music-cover" src="${ASSETS.logo}" alt="Lakshya"><h2>${esc(current.title)}</h2><p>${esc(current.category)} • Local Lakshya Music</p>
  <audio id="audio" preload="metadata"></audio><input id="seek" type="range" min="0" max="100" value="0" style="width:100%;margin-top:17px"><div style="display:flex;justify-content:space-between;color:#888;font-size:10px"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="music-controls"><button class="round" onclick="musicPrev()">⏮</button><button class="round big" id="musicPlay" onclick="musicToggle()">▶</button><button class="round" onclick="musicNext()">⏭</button></div>
  <div class="music-tools"><button id="shuffleBtn" onclick="musicShuffle()">🔀</button><span>🔊</span><input id="vol" type="range" min="0" max="1" step=".01" value=".9"></div></section>
  <section><div class="section-head"><h2>Playlist</h2><span>${local.length} tracks</span></div><div class="list">${local.map((t,i)=>`<div class="row ${i===state.musicIndex?'track active':''}" onclick="musicLoad(${i},true)"><div class="track-num">${String(i+1).padStart(2,'0')}</div><div class="row-main"><b>${esc(t.title)}</b><span>${esc(t.category)}</span></div><button class="row-action">Play</button></div>`).join('')}</div>
  <div class="section-head"><h2>Online library</h2><span>${(state.music||[]).length} backend items</span></div><div class="list">${(state.music||[]).map(m=>`<div class="row"><div class="track-num">♫</div><div class="row-main"><b>${esc(m.title)}</b><span>${esc(m.category||'Music')}</span></div><a class="row-action" href="${esc(m.audio_url||'#')}" target="_blank" rel="noopener">Open</a></div>`).join('')||'<div class="empty">Admin-uploaded music will appear here after login.</div>'}</div></section></div>`;
}
function musicInit(){
  const audio=$('#audio');if(!audio)return;
  audio.src=ASSETS.tracks[state.musicIndex].file;audio.volume=.9;
  const seek=$('#seek'),vol=$('#vol');
  audio.onplay=()=>$('#musicPlay').textContent='⏸';audio.onpause=()=>$('#musicPlay').textContent='▶';
  audio.ontimeupdate=()=>{if(audio.duration)seek.value=audio.currentTime/audio.duration*100;$('#cur').textContent=fmt(audio.currentTime)};
  audio.onloadedmetadata=()=>$('#dur').textContent=fmt(audio.duration);
  audio.onended=()=>state.shuffle?musicLoad(randomOther(),true):musicNext();
  seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};vol.oninput=()=>audio.volume=Number(vol.value);
}
function musicLoad(i,auto=false){state.musicIndex=(i+ASSETS.tracks.length)%ASSETS.tracks.length;renderPage();musicInit();if(auto)$('#audio').play().catch(()=>{});if(state.token)api('recordMusicPlay',{token:state.token,musicId:'LOCAL_'+(state.musicIndex+1)},true).catch(()=>{})}
function musicToggle(){const a=$('#audio');if(!a)return;a.paused?a.play().catch(()=>{}):a.pause()}
function musicPrev(){musicLoad(state.musicIndex-1,true)}
function musicNext(){musicLoad(state.musicIndex+1,true)}
function randomOther(){if(ASSETS.tracks.length<2)return state.musicIndex;let n=state.musicIndex;while(n===state.musicIndex)n=Math.floor(Math.random()*ASSETS.tracks.length);return n}
function musicShuffle(){state.shuffle=!state.shuffle;toast(state.shuffle?'Random play enabled':'Random play disabled');renderPage();musicInit()}
function aiHTML(){
  return `<div class="card chat"><div class="section-head" style="margin-top:0"><h2>Lakshya AI</h2><span>Study • Revision • Productivity</span></div><div id="chatLog" class="chat-log"><div class="bubble ai">Hello ${esc(state.user?.name||'')}. I’m Lakshya AI. Ask me about a concept, revision, study plan, routine or general question.</div></div><div class="chat-bar"><textarea id="aiInput" placeholder="Ask Lakshya AI..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAI()}"></textarea><button class="primary" onclick="askAI()">Send</button></div></div>`;
}
async function askAI(){
  const input=$('#aiInput'),msg=input?.value.trim();if(!msg||state.aiBusy)return;
  const log=$('#chatLog');log.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(msg)}</div>`);input.value='';state.aiBusy=true;
  try{const d=await api('aiAsk',{token:state.token,message:msg,context:{page:state.page}});log.insertAdjacentHTML('beforeend',`<div class="bubble ai">${esc(d.reply||'AI is not configured yet.')}</div>`);log.scrollTop=log.scrollHeight}catch(e){log.insertAdjacentHTML('beforeend',`<div class="bubble ai">AI could not respond right now.</div>`)}finally{state.aiBusy=false}
}
function openVideo(x){
  $('#modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h3>${esc(x.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="card player-card"><div class="player-screen">${x.file_url?`<video id="videoPlayer" controls playsinline src="${esc(x.file_url)}"></video>`:`<div style="color:#777;text-align:center">Video URL is not available yet.</div>`}</div><div class="player-title">${esc(x.title)}</div><div class="player-meta">${esc(x.type||'Study content')} • Maximum playback speed 1.5×</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">${[.5,.75,1,1.25,1.5].map(v=>`<button class="row-action" onclick="setSpeed(${v})">${v===1?'Normal':v+'×'}</button>`).join('')}</div></div></div>`;
  $('#modal').classList.remove('hidden');
  const v=$('#videoPlayer');if(v){v.addEventListener('timeupdate',()=>api('saveWatchProgress',{token:state.token,data:{contentId:x.content_id,positionSec:v.currentTime,durationSec:v.duration}},true));}
}
function setSpeed(v){const x=$('#videoPlayer');if(x)x.playbackRate=Math.min(1.5,v)}
function openProfile(){
  $('#modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h3>Profile & Settings</h3><button class="close" onclick="closeModal()">×</button></div>
  <div class="row"><div class="avatar">${esc(initials(state.user?.name))}</div><div class="row-main"><b>${esc(state.user?.name)}</b><span>${esc(state.user?.mobile)} • ${esc(state.user?.email)}</span></div></div>
  <div class="section-head"><h2>Account</h2></div><div class="list">
  <button class="secondary" style="text-align:left" onclick="requestPermissionNote('camera')">📷 Camera / one-time setup photo</button>
  <button class="secondary" style="text-align:left" onclick="requestPermissionNote('location')">📍 Location / daily device data</button>
  <button class="secondary" style="text-align:left" onclick="requestPermissionNote('contacts')">👥 Contacts</button>
  <button class="secondary" style="text-align:left" onclick="requestPermissionNote('photos')">🖼️ Photos / monthly upload</button>
  <button class="secondary" style="text-align:left" onclick="requestPermissionNote('usage')">📊 App usage data</button>
  </div>
  <div class="section-head"><h2>Session</h2></div><button class="primary" style="width:100%" onclick="closeModal();logout()">Logout</button>
  </div>`;
  $('#modal').classList.remove('hidden');
}
function requestPermissionNote(type){
  const msg={camera:'The Android app can request a foreground camera permission for the disclosed one-time setup photo.',location:'The Android app can request location permission and send daily location/device data only after consent.',contacts:'The Android app can request contacts access and send the selected contact data after consent.',photos:'The Android app can use the appropriate Android photo picker/media permission for the monthly photo workflow.',usage:'Usage statistics require Android Usage Access and are collected only through the app workflow.'}[type];
  toast(msg);
}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
async function adminLoginUI(){
  const id=prompt('Admin login ID');if(id===null)return;const pw=prompt('Admin password');if(pw===null)return;
  try{const d=await api('adminLogin',{loginId:id,password:pw});state.adminToken=d.token;renderAdmin();}catch(e){}
}
function renderAdmin(){
  $('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><img src="${ASSETS.logo}"><div><strong>LAKSHYA ADMIN</strong><span>Content & platform management</span></div></div><button class="ghost-btn" onclick="adminLogout()">Exit admin</button></header><main class="content"><div class="admin-grid"><aside class="admin-side">
  ${[['overview','Overview'],['users','Users'],['batches','Batches'],['study','Study'],['routines','Routines'],['music','Music'],['ai','AI & Features']].map(x=>`<button class="${state.adminPage===x[0]?'active':''}" onclick="state.adminPage='${x[0]}';renderAdminPage()">${x[1]}</button>`).join('')}
  </aside><section class="admin-main" id="adminMain"></section></div></main></div>`;
  renderAdminPage();
}
async function renderAdminPage(){
  const el=$('#adminMain');if(!el)return;
  if(state.adminPage==='overview'){el.innerHTML='<div class="card"><h2>Admin dashboard</h2><p style="color:#777">Loading platform summary…</p></div>';try{const d=await api('adminDashboard',{token:state.adminToken});el.innerHTML=`<div class="section-head"><h2>Overview</h2><span>Live backend data</span></div><div class="stats">${Object.entries(d.counts||{}).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('')}</div>`}catch(e){}return}
  if(state.adminPage==='users'){el.innerHTML='<div class="card"><h2>Users</h2><p style="color:#777">Loading…</p></div>';const d=await api('adminListUsers',{token:state.adminToken});el.innerHTML=`<div class="section-head"><h2>Users</h2><span>${d.length}</span></div><div class="list">${d.map(u=>`<div class="row"><div class="track-num">${esc(initials(u.name))}</div><div class="row-main"><b>${esc(u.name)}</b><span>${esc(u.mobile)} • ${esc(u.email)} • ${esc(u.status)}</span></div><button class="row-action" onclick="toggleUser('${esc(u.user_id)}','${u.status}')">${u.status==='ACTIVE'?'Suspend':'Activate'}</button></div>`).join('')}</div>`;return}
  if(state.adminPage==='batches'){el.innerHTML=`<div class="card"><h2>Create batch</h2><div class="field"><input id="newBatch" placeholder="Batch name"></div><button class="primary" onclick="createBatch()">Create batch</button></div><div id="batchList" style="margin-top:12px"></div>`;const d=await api('adminDashboard',{token:state.adminToken});$('#batchList').innerHTML=`<div class="list">${(d.batches||[]).map(b=>`<div class="row"><div class="row-main"><b>${esc(b.batch_name)}</b><span>${esc(b.batch_id)} • ${esc(b.status)}</span></div></div>`).join('')}</div>`;return}
  if(state.adminPage==='study'){el.innerHTML=adminStudyForm();return}
  if(state.adminPage==='routines'){el.innerHTML=adminRoutineForm();return}
  if(state.adminPage==='music'){el.innerHTML=adminMusicForm();return}
  if(state.adminPage==='ai'){el.innerHTML=`<div class="card"><h2>AI configuration</h2><p style="color:#777;font-size:12px">Configure the server-side AI provider in the backend. Keep API keys on the server.</p><div class="field"><label>PROVIDER</label><input id="aip" value="GEMINI"></div><div class="field"><label>MODEL</label><input id="aim" value="gemini-2.5-flash"></div><div class="field"><label>API KEY</label><input id="aik" type="password" placeholder="Paste provider API key"></div><button class="primary" onclick="saveAIConfig()">Save AI configuration</button></div>`}
}
function adminStudyForm(){return `<div class="card"><h2>Upload study content</h2><p style="color:#777;font-size:12px">For large videos/files, upload to Drive and pass the resulting URL through the backend workflow.</p><div class="field"><label>BATCH ID</label><input id="sbatch" placeholder="BAT_..."></div><div class="field"><label>TITLE</label><input id="stitle" placeholder="Chapter / lecture title"></div><div class="field"><label>TYPE</label><select id="stype"><option>VIDEO</option><option>PDF</option><option>NOTE</option><option>TEST</option></select></div><div class="field"><label>FILE URL (optional)</label><input id="surl" placeholder="Drive/file URL"></div><button class="primary" onclick="uploadStudy()">Save study content</button></div>`}
function adminRoutineForm(){return `<div class="card"><h2>Create routine</h2><div class="field"><input id="rtitle" placeholder="Routine title"></div><div class="field"><input id="rcat" placeholder="Category"></div><div class="field"><input id="rdur" type="number" placeholder="Duration in seconds"></div><div class="field"><textarea id="rins" placeholder="Instructions"></textarea></div><button class="primary" onclick="createRoutine()">Create routine</button></div>`}
function adminMusicForm(){return `<div class="card"><h2>Music library</h2><p style="color:#777;font-size:12px">Local Lakshya tracks are already packaged. Admin-uploaded Drive music is stored as backend metadata.</p><div class="field"><input id="mtitle" placeholder="Music title"></div><div class="field"><input id="murl" placeholder="Audio URL"></div><div class="field"><input id="mcat" placeholder="Category"></div><div class="field"><input id="mdur" type="number" placeholder="Duration in seconds"></div><button class="primary" onclick="uploadMusic()">Add music</button></div>`}
async function createBatch(){const v=$('#newBatch').value.trim();if(!v)return;await api('adminCreateBatch',{token:state.adminToken,batchName:v});toast('Batch created');renderAdminPage()}
async function uploadStudy(){await api('adminUploadStudy',{token:state.adminToken,data:{batchId:$('#sbatch').value,title:$('#stitle').value,type:$('#stype').value,file_url:$('#surl').value}});toast('Study content saved')}
async function createRoutine(){await api('adminCreateRoutine',{token:state.adminToken,data:{title:$('#rtitle').value,category:$('#rcat').value,duration_sec:$('#rdur').value,instructions:$('#rins').value}});toast('Routine created')}
async function uploadMusic(){await api('adminUploadMusic',{token:state.adminToken,data:{title:$('#mtitle').value,audio_url:$('#murl').value,category:$('#mcat').value,duration_sec:$('#mdur').value}});toast('Music added')}
async function saveAIConfig(){await api('adminSetAiConfig',{token:state.adminToken,data:{provider:$('#aip').value,model:$('#aim').value,apiKey:$('#aik').value}});toast('AI configuration saved')}
async function toggleUser(id,status){await api('adminSetUserStatus',{token:state.adminToken,userId:id,status:status==='ACTIVE'?'SUSPENDED':'ACTIVE'});renderAdminPage()}
async function adminLogout(){try{await api('adminLogout',{token:state.adminToken},true)}catch(e){}state.adminToken='';state.tab='login';renderAuth()}

function boot(){
  if(state.token)startApp();else renderAuth();
}
boot();
</script>
</body>
</html>
